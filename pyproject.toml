[project]
name = "jgit"
version = "0.1.0"
description = "Workflow for Git"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [ "iterfzf", "rich", "sh" ]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project.scripts]
jgit-cleanup-branches = "cleanup:main"
jgit-edit-branches = "edit:main"
jgit-new-branch = "new:main"
jgit-change-branch = "change:main"
jgit-dev = "dev:main"
jgit-track-this = "track:main"
jgit-rename-this = "rename:main"
jgit-del-branches = "delete:main"
jgit-wt-new = "worktree:new"
jgit-wt-del = "worktree:remove"
